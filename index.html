<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MX DESIGNER Admin</title><link rel="stylesheet" href="styles.css"></head><body><header><b>MX DESIGNER</b><button id="logout">Logout</button></header><main><section id="login" class="box"><h1>Admin Login</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button><p id="loginmsg"></p></section><section id="dash" hidden><h1>Admin Dashboard</h1><div class="cols"><section class="box"><h2>Add Portfolio</h2><input id="title" placeholder="Project title"><select id="cat"><option>Graphic Design</option><option>UI/UX</option><option>Brand Identity</option></select><textarea id="desc" placeholder="Description"></textarea><input id="image" placeholder="Image URL (temporary)"><label><input id="pub" type="checkbox" checked> Published</label><button id="add">Add Project</button><p id="pmsg"></p></section><section class="box"><h2>Private Client</h2><input id="cn" placeholder="Client name"><input id="ce" placeholder="Email"><input id="cp" placeholder="Phone"><input id="cj" placeholder="Project"><textarea id="notes" placeholder="Private notes"></textarea><button id="save">Save Client</button><p id="cmsg"></p></section></div><section class="box"><h2>Projects</h2><div id="projects"></div></section><section class="box"><h2>Private Clients</h2><div id="clients"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
